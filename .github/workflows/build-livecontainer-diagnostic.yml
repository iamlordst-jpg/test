name: Build CLEO LiveContainer Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "diagnostic/**"
      - ".github/workflows/build-livecontainer-diagnostic.yml"

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build
        working-directory: diagnostic
        run: |
          cargo build --release --target aarch64-apple-ios

      - name: Prepare package
        run: |
          mkdir -p dist
          cp diagnostic/target/aarch64-apple-ios/release/libcleo_diagnostic.dylib dist/CLEO.dylib
          cp deb.CLEO.plist dist/CLEO.plist
          cp README.md dist/README.txt
          cd dist
          zip -r ../CLEO-LiveContainer-Diagnostic.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: CLEO-LiveContainer-Diagnostic
          path: CLEO-LiveContainer-Diagnostic.zip