name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project ClaudePocket.xcodeproj -scheme ClaudePocket \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              grep -E "error:" build.log | sort -u | head -12 | while read -r l; do echo "::error::$l"; done
              tail -n 15 build.log | while read -r l; do echo "::warning::$l"; done
              exit 1
            }
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ClaudePocket.app Payload/
          zip -r ClaudePocket.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudePocket-ipa
          path: ClaudePocket.ipa
